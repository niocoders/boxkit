server:
  port: 8080

spring:
  application:
    name: boxkit-market-server
  datasource:
    # createDatabaseIfNotExist=true：首次启动自动建库
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:boxkit_market}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: utf-8          # 启动时执行 schema.sql / data.sql（均为幂等语句）
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.boxkit.market: INFO

boxkit:
  market:
    # .bkx / logo 存储目录（相对启动目录）
    storage: ./storage
