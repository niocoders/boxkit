# H2 内存库演示 profile：与 MySQL 模式兼容（生产/正式环境不要用本 profile）
# 启动：java -Dspring.profiles.active=h2 -jar target/market-server-1.0.0.jar
spring:
  datasource:
    url: jdbc:h2:mem:boxkit_market;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
