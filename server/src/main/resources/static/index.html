<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoxKit 插件市场 — 用户端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f5f7; color:#333; min-height:100vh; }
header { background:#fff; border-bottom:1px solid #ebedf0; padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:10; }
.mark { width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg,#4f6bff,#23c4ff); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
h1 { font-size:18px; }
.search { flex:1; max-width:420px; display:flex; }
.search input { flex:1; border:1px solid #ddd; border-radius:8px 0 0 8px; padding:8px 12px; font-size:14px; outline:none; }
.search input:focus { border-color:#4a90d9; }
.search button { border:none; background:#4a90d9; color:#fff; padding:0 18px; border-radius:0 8px 8px 0; cursor:pointer; }
.admin-link { margin-left:auto; font-size:13px; color:#999; text-decoration:none; }
.admin-link:hover { color:#4a90d9; }
main { max-width:1080px; margin:24px auto; padding:0 24px; }
.tip { background:#e8f3fc; border:1px solid #cfe4f7; color:#2b6cb0; font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:18px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
.card { background:#fff; border:1px solid #ebedf0; border-radius:12px; padding:16px; }
.head { display:flex; gap:12px; align-items:center; }
.logo { width:48px; height:48px; border-radius:12px; object-fit:contain; background:#f5f6f8; }
.name { font-size:15px; font-weight:600; }
.meta { font-size:12px; color:#999; margin-top:2px; }
.desc { font-size:13px; color:#666; margin:10px 0; min-height:36px; line-height:1.5; }
.foot { display:flex; align-items:center; justify-content:space-between; }
.dl-count { font-size:12px; color:#999; }
.btns { display:flex; gap:8px; }
button { border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:13px; }
.primary { background:#4a90d9; color:#fff; }
.primary:hover { background:#3a7cc4; }
.plain { background:#f0f2f5; color:#555; }
.empty { text-align:center; color:#999; padding:60px 0; }
.err { background:#fdecec; color:#c0392b; border:1px solid #f5c6cb; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <div class="mark">B</div>
  <h1>BoxKit 插件市场</h1>
  <div class="search">
    <input id="kw" placeholder="搜索插件：剪贴板、便签、时间戳…" onkeydown="if(event.key==='Enter')load()">
    <button onclick="load()">搜索</button>
  </div>
  <a class="admin-link" href="/admin.html">管理入口 →</a>
</header>
<main>
  <div class="tip">已安装 <b>BoxKit</b> 客户端？点击「导入到 BoxKit」会在客户端内自动完成下载与安装。尚未安装？点「下载 .bkx」后在客户端「设置 → 插件 → 安装插件包」选择该文件即可。</div>
  <div id="err"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">没有找到匹配的插件</div>
</main>
<script>
const API = '/api/market/plugins';
async function load() {
  const kw = document.getElementById('kw').value.trim();
  document.getElementById('err').style.display = 'none';
  try {
    const r = await fetch(API + '?keyword=' + encodeURIComponent(kw) + '&page=1&size=50');
    const j = await r.json();
    const list = (j.data && j.data.records) || [];
    render(list);
  } catch (e) {
    document.getElementById('err').textContent = '无法连接市场服务，请确认后台已启动。';
    document.getElementById('err').style.display = 'block';
    document.getElementById('grid').innerHTML = '';
  }
}
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function render(list) {
  const g = document.getElementById('grid');
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  g.innerHTML = list.map(p => `
    <div class="card">
      <div class="head">
        ${p.logoUrl ? `<img class="logo" src="/storage/${esc(p.logoUrl)}">` : `<div class="logo" style="display:flex;align-items:center;justify-content:center;font-weight:700;color:#4a90d9">${esc((p.displayName||'?')[0])}</div>`}
        <div>
          <div class="name">${esc(p.displayName)} <span style="color:#999;font-weight:400">v${esc(p.latestVersion)}</span></div>
          <div class="meta">${esc(p.author || '未知开发者')} · ${(p.downloads||0).toLocaleString()} 次安装</div>
        </div>
      </div>
      <div class="desc">${esc(p.description || '无描述')}</div>
      <div class="foot">
        <span class="dl-count">${esc(p.pluginId)}</span>
        <div class="btns">
          <button class="primary" onclick="location.href='boxkit-market://install/${esc(p.pluginId)}'">导入到 BoxKit</button>
          <button class="plain" onclick="location.href='/api/market/plugins/${esc(p.pluginId)}/download'">下载 .bkx</button>
        </div>
      </div>
    </div>`).join('');
}
load();
</script>
</body>
</html>
