name: Pages（插件市场发布）

# 市场静态文件托管在公开仓 niocoders/boxkit-market（GitHub Pages 免费承载）。
# 主仓保持私有：此处 CI 构建市场后 push 到公开仓，由公开仓的 Pages 直接服务。
#
# 启用前提：仓库 Settings → Secrets and variables → Actions 配置
#   MARKET_PAT：一个有「公开仓 boxkit-market 推送权」的 PAT（classic，scope: repo 或 public_repo）
#   注意：仅 workflow 权限的 GITHUB_TOKEN 无法跨仓库推送。
on:
  push:
    branches: [main]
    paths: ["plugins/**", "market/**", "tools/build-market.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建市场（打包 .bkx + 生成 manifest.json）
        run: node tools/build-market.mjs
      - name: 发布到公开市场仓（boxkit-market）
        env:
          MARKET_PAT: ${{ secrets.MARKET_PAT }}
        run: |
          set -eu
          test -n "${MARKET_PAT:-}" || { echo "::error::缺少 MARKET_PAT secret，无法发布市场"; exit 1; }
          git config --global user.name "boxkit-market-bot"
          git config --global user.email "bot@niocoders.github.io"
          rm -rf /tmp/market-pub && mkdir -p /tmp/market-pub
          cp -r market/. /tmp/market-pub/
          cd /tmp/market-pub
          git init -q
          git checkout -q -b main
          git add -A
          git -c user.name=boxkit-market-bot -c user.email=bot@niocoders.github.io commit -qm "chore: 发布插件市场 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${MARKET_PAT}@github.com/niocoders/boxkit-market.git"
          git push -q -f origin main
          echo "已发布 https://niocoders.github.io/boxkit-market/"
